<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="夜の赤月ミニゲームの遊び方です。">
  <title>ゲーム説明 | 夜の赤月</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="yoruaka_game.css?v=game-1">
</head>
<body class="yoruaka-body explanation-page">
  <main class="explanation-screen">
    <header class="explanation-header">
      <img src="images/hype_logo.png" alt="HypeScript" class="circle-mark">
      <div>
        <p class="screen-kicker">How to play</p>
        <h1>おや、赤い月が濁っているよ！<br>みんなで綺麗にしよう！</h1>
      </div>
    </header>

    <div class="explanation-visual" aria-label="赤く濁った月が掃除によって元の色へ戻る様子">
      <figure class="moon-comparison">
        <div class="mini-moon-wrap">
          <img src="images/moon(nontitle).png" alt="赤く濁った掃除前の月" class="mini-moon">
        </div>
        <figcaption>BEFORE</figcaption>
      </figure>
      <div class="comparison-action" aria-hidden="true">
        <span>→</span>
        <img src="images/zoukin_boy.png" alt="" class="mini-cleaner">
      </div>
      <figure class="moon-comparison">
        <div class="mini-moon-wrap mini-moon-wrap--after">
          <img src="images/moon(nontitle).png" alt="元の色に戻った掃除後の月" class="mini-moon">
        </div>
        <figcaption>AFTER</figcaption>
      </figure>
    </div>

    <ol class="rule-list">
      <li><span>Look at！ なんということでしょう！ お月様が赤く染まってしまいました！</span></li>
      <li><span>でも安心して！　頼りになるお掃除屋さんがやってきたよ！</span></li>
      <li><span>お掃除屋さんをタップすると、お月様を掃除してくれるよ！</span></li>
      <li><span>ピッカピカに磨いて、お月様を元の姿に戻してあげたらゲームクリア！</span></li>
      <li><span>でも気を付けて！ チャンスは7回だけだよ。慎重に掃除しよう！</span></li>
    </ol>

    <div class="explanation-actions">
      <a class="game-button game-button--play" href="yoruaka_game.html">《プレイ》</a>
      <a class="game-button game-button--light" href="yoruaka_menu.html">《戻る》</a>
    </div>
  </main>
</body>
</html>
