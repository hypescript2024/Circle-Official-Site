<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blackdeath - 試し読み前演出</title>
    <meta name="description" content="Blackdeathの試し読み演出ページ">
    <link rel="stylesheet" href="./blackdeath.css">
  </head>
  <body>
    <!--
      blackdeath intro effect:
      制作物一覧から blackdeath.html へリンクすると、この中間演出が再生。
      遷移先URLと表示文言は blackdeath.js の BLACKDEATH_CONFIG で管理。
    -->
    <main class="blackdeath-stage" aria-label="Blackdeath 試し読み前演出">
      <div class="background-image" aria-hidden="true"></div>
      <div class="noise-layer" aria-hidden="true"></div>

      <p id="glitchLine" class="glitch" data-text="" aria-live="polite"></p>
    </main>

    <script src="./blackdeath.js" defer></script>
  </body>
</html>
